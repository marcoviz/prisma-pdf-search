name: Validate PDF pipeline

on:
  push:
    branches: [main, feature/final-review-fixes]
    paths: [src/**, tests/**, requirements.txt, docker-compose.yml, .github/workflows/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test pipeline, throttling and real PostgreSQL persistence
        env:
          PYTHONPATH: src
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rag
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee validation.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prisma-validation
          path: validation.log
          retention-days: 1
          if-no-files-found: ignore
